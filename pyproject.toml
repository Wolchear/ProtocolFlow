[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ProtocolFlow"
version = "0.1.0"
description = "Protocol parsing and validation"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "Jinja2>=3"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
protocolFlow = "ProtocolFlow.protocolFlow:main"